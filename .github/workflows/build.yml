name: Build BetterAltay

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Build PHAR
        run: php -d phar.readonly=0 build/server_phar.php

      - uses: actions/upload-artifact@v4
        with:
          name: BetterAltay
          path: BetterAltay.phar
