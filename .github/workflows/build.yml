name: Build BetterAltay

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.0"
          extensions: yaml, zip
          coverage: none

      - name: Instalar Composer
        run: composer install --no-dev --ignore-platform-reqs

      - name: Crear PHAR
        run: php -d phar.readonly=0 build/server-phar.php

      - name: Subir BetterAltay.phar
        uses: actions/upload-artifact@v4
        with:
          name: BetterAltay
          path: BetterAltay.phar
